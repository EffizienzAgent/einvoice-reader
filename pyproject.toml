[project]
name = "einvoice-reader"
version = "0.1.0"
description = "Read and validate ZUGFeRD, Factur-X and XRechnung e-invoices over a stable HTTP API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "factur-x>=7.7",
    "lxml>=5.3",
    "saxonche>=13.1",
    "pydantic>=2.9",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx2", "ruff>=0.8", "psutil>=6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/einvoice_reader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running soak tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
